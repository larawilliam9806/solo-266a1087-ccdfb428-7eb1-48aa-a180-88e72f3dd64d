<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公交 GTFS 时刻表发布</title>
<style>
  :root { --blue:#1a73e8; --red:#d93025; --green:#1e8e3e; --border:#dadce0; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f5f6f7; color: #202124; }
  header { background: var(--blue); color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  nav { background: #fff; border-bottom: 1px solid var(--border); padding: 0 24px; }
  nav button { background: none; border: none; padding: 12px 16px; font-size: 14px;
               cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  main { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
  section.panel { display: none; }
  section.panel.active { display: block; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 8px;
          padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #5f6368; }
  input[type=text], input[type=date], select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; min-width: 220px; }
  input[type=file] { font-size: 13px; }
  button.primary { background: var(--blue); color: #fff; border: none; border-radius: 4px;
                   padding: 9px 20px; font-size: 14px; cursor: pointer; margin-top: 14px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  th { background: #f1f3f4; }
  .ok { color: var(--green); font-weight: 600; }
  .bad { color: var(--red); font-weight: 600; }
  .muted { color: #5f6368; font-size: 12px; }
  .banner { padding: 10px 14px; border-radius: 4px; margin-top: 12px; font-size: 14px; }
  .banner.ok { background: #e6f4ea; color: var(--green); }
  .banner.err { background: #fce8e6; color: var(--red); }
  .trip { margin-top: 18px; }
  .trip h3 { font-size: 14px; margin: 0 0 6px; }
  .nextday { color: var(--red); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 24px; }
  code { background: #f1f3f4; padding: 1px 5px; border-radius: 3px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge.add { background: #e6f4ea; color: var(--green); }
  .badge.rm { background: #fce8e6; color: var(--red); }
  .badge.adj { background: #fef7e0; color: #b06000; }
  .badge.same { background: #e8f0fe; color: var(--blue); }
  .badge.conflict { background: #fce8e6; color: var(--red); }
  .delta-pos { color: var(--red); font-weight: 600; }
  .delta-neg { color: var(--blue); font-weight: 600; }
  .delta-zero { color: #5f6368; }
  .diff-group { margin-top: 16px; }
  .diff-group h3 { font-size: 14px; margin: 0 0 8px; }
  .summary-pills span { display: inline-block; margin-right: 10px; font-size: 13px; padding: 3px 10px;
                        border: 1px solid var(--border); border-radius: 12px; background: #f8f9fa; }
  .tripmini { font-size: 12px; color: #5f6368; }
</style>
</head>
<body>
<header><h1>🚌 公交 GTFS 时刻表发布系统</h1></header>
<nav>
  <button data-tab="query" class="active">时刻查询</button>
  <button data-tab="diff">运行图差异分析</button>
  <button data-tab="publish">发布新版本</button>
  <button data-tab="versions">版本记录</button>
</nav>
<main>

<!-- ============ 时刻查询 ============ -->
<section id="tab-query" class="panel active">
  <div class="card">
    <h2>按线路和运营日查询</h2>
    <div class="grid">
      <div>
        <label>运营日</label>
        <input type="date" id="q-date">
      </div>
      <div>
        <label>线路</label>
        <select id="q-route"></select>
      </div>
    </div>
    <button class="primary" id="q-btn">查询</button>
    <span class="muted" id="q-meta"></span>
    <div id="q-result"></div>
  </div>
</section>

<!-- ============ 运行图差异分析 ============ -->
<section id="tab-diff" class="panel">
  <div class="card">
    <h2>两个已发布版本的运行图差异</h2>
    <p class="muted">选择两个不同的已发布版本、线路与同一运营日。系统分别固定两版完整快照后整体比较：
       班次号变化时按线路、运营日与有序停站序列匹配；候选不唯一会报冲突并列出对应班次，不擅自合并。
       版本或日期无效时直接报错，不会生成部分结果。</p>
    <div class="grid">
      <div>
        <label>旧版本（基准）</label>
        <select id="d-old"></select>
      </div>
      <div>
        <label>新版本（对比）</label>
        <select id="d-new"></select>
      </div>
      <div>
        <label>运营日</label>
        <input type="date" id="d-date">
      </div>
      <div>
        <label>线路</label>
        <select id="d-route"></select>
      </div>
    </div>
    <button class="primary" id="d-btn">分析差异</button>
    <div id="d-result"></div>
  </div>
</section>

<!-- ============ 发布 ============ -->
<section id="tab-publish" class="panel">
  <div class="card">
    <h2>上传同一版本的 5 个 CSV</h2>
    <p class="muted">整版校验（跨表引用、停站序号唯一、时刻递增、跨午夜时刻）全部通过才会发布；
       任一错误都会保留当前正式版，并在此列出错误行。</p>
    <label>版本名称</label>
    <input type="text" id="p-label" placeholder="例如 2026-冬季运行图 v2">
    <div class="grid">
      <div><label>stops.csv</label><input type="file" id="f-stops" accept=".csv"></div>
      <div><label>routes.csv</label><input type="file" id="f-routes" accept=".csv"></div>
      <div><label>trips.csv</label><input type="file" id="f-trips" accept=".csv"></div>
      <div><label>stop_times.csv</label><input type="file" id="f-stop_times" accept=".csv"></div>
      <div><label>calendar.csv</label><input type="file" id="f-calendar" accept=".csv"></div>
    </div>
    <button class="primary" id="p-btn">校验并发布</button>
    <div id="p-result"></div>
  </div>
</section>

<!-- ============ 版本记录 ============ -->
<section id="tab-versions" class="panel">
  <div class="card">
    <h2>版本记录 <button class="primary" style="margin:0 0 0 10px;padding:4px 12px" id="v-refresh">刷新</button></h2>
    <div id="v-list"></div>
  </div>
</section>

</main>
<script>
const $ = (id) => document.getElementById(id);

// ---------- 页签 ----------
document.querySelectorAll("nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll("section.panel").forEach(s => s.classList.remove("active"));
    btn.classList.add("active");
    $("tab-" + btn.dataset.tab).classList.add("active");
    if (btn.dataset.tab === "versions") loadVersions();
    if (btn.dataset.tab === "query") loadRoutes();
    if (btn.dataset.tab === "diff") initDiffTab();
  };
});

// ---------- 时刻查询 ----------
$("q-date").value = new Date().toISOString().slice(0, 10);

async function loadRoutes() {
  const sel = $("q-route");
  try {
    const res = await fetch("/api/routes");
    const data = await res.json();
    if (!res.ok) { sel.innerHTML = "<option value=''>（" + (data.detail || "无数据") + "）</option>"; return; }
    sel.innerHTML = data.routes.map(r =>
      `<option value="${r.route_id}">${r.route_short_name || r.route_id} ${r.route_long_name || ""}</option>`).join("");
    $("q-meta").textContent = "当前正式版：v" + data.version_id;
  } catch (e) { sel.innerHTML = "<option>加载失败</option>"; }
}

$("q-btn").onclick = async () => {
  const route = $("q-route").value, date = $("q-date").value;
  const box = $("q-result");
  if (!route || !date) { box.innerHTML = '<div class="banner err">请选择线路和运营日</div>'; return; }
  const res = await fetch(`/api/routes/${encodeURIComponent(route)}/schedule?date=${date}`);
  const data = await res.json();
  if (!res.ok) { box.innerHTML = `<div class="banner err">${data.detail || "查询失败"}</div>`; return; }
  if (data.trips.length === 0) {
    box.innerHTML = '<div class="banner err">该运营日没有班次（线路在此日期无有效服务）</div>';
    return;
  }
  box.innerHTML = `<p class="muted">版本 v${data.version_id} · ${data.date}（${data.weekday}）· 共 ${data.trip_count} 个班次</p>` +
    data.trips.map(t => `
      <div class="trip">
        <h3>班次 ${t.trip_id}${t.headsign ? " · " + t.headsign : ""} <span class="muted">service: ${t.service_id}</span></h3>
        <table>
          <tr><th>序号</th><th>站点</th><th>到站</th><th>发车</th></tr>
          ${t.stop_times.map(s => `<tr>
            <td>${s.stop_sequence}</td>
            <td>${s.stop_name} <span class="muted">${s.stop_id}</span></td>
            <td>${s.arrival}${s.arrival_day_offset > 0 ? ` <span class="nextday">+${s.arrival_day_offset}天</span>` : ""}</td>
            <td>${s.departure}${s.departure_day_offset > 0 ? ` <span class="nextday">+${s.departure_day_offset}天</span>` : ""}</td>
          </tr>`).join("")}
        </table>
      </div>`).join("");
};

// ---------- 发布 ----------
$("p-btn").onclick = async () => {
  const label = $("p-label").value.trim();
  const box = $("p-result");
  if (!label) { box.innerHTML = '<div class="banner err">请填写版本名称</div>'; return; }
  const fd = new FormData();
  fd.append("label", label);
  for (const name of ["stops", "routes", "trips", "stop_times", "calendar"]) {
    const f = $("f-" + name).files[0];
    if (!f) { box.innerHTML = `<div class="banner err">请选择 ${name}.csv</div>`; return; }
    fd.append(name, f);
  }
  $("p-btn").disabled = true;
  try {
    const res = await fetch("/api/versions", { method: "POST", body: fd });
    const data = await res.json();
    if (res.ok) {
      box.innerHTML = `<div class="banner ok">✔ 版本 v${data.version_id}「${label}」发布成功：
        stops ${data.counts.stops} 行 · routes ${data.counts.routes} 行 · trips ${data.counts.trips} 行 ·
        stop_times ${data.counts.stop_times} 行 · calendar ${data.counts.calendar} 行</div>`;
    } else if (res.status === 422 && data.detail && data.detail.errors) {
      const d = data.detail;
      box.innerHTML = `<div class="banner err">✘ 校验失败（版本 v${d.version_id} 已记录为失败），
        共 ${d.error_count} 个错误${d.truncated ? "（已截断）" : ""}，当前正式版保持不变：</div>
        <table><tr><th>文件</th><th>行号</th><th>字段</th><th>错误</th></tr>
        ${d.errors.map(e => `<tr><td>${e.file}</td><td>${e.row ?? "-"}</td>
          <td>${e.field ?? "-"}</td><td>${e.message}</td></tr>`).join("")}
        </table>`;
    } else {
      box.innerHTML = `<div class="banner err">发布失败：${JSON.stringify(data)}</div>`;
    }
  } finally {
    $("p-btn").disabled = false;
  }
};

// ---------- 版本记录 ----------
async function loadVersions() {
  const res = await fetch("/api/versions");
  const data = await res.json();
  const box = $("v-list");
  if (!data.versions.length) { box.innerHTML = '<p class="muted">还没有任何版本</p>'; return; }
  box.innerHTML = `<table><tr><th>ID</th><th>名称</th><th>状态</th><th>错误数</th><th>上传时间</th><th>发布时间</th><th></th></tr>
    ${data.versions.map(v => `<tr>
      <td>v${v.id}${v.id === data.current_version_id ? ' <span class="ok">●当前</span>' : ""}</td>
      <td>${v.label}</td>
      <td>${v.status === "published" ? '<span class="ok">已发布</span>' : '<span class="bad">失败</span>'}</td>
      <td>${v.error_count}</td><td>${v.created_at}</td><td>${v.published_at || "-"}</td>
      <td>${v.status === "failed" ? `<a href="#" onclick="showErrors(${v.id});return false">查看错误</a>` : ""}</td>
    </tr>`).join("")}</table>
    <div id="v-errors"></div>`;
}

async function showErrors(vid) {
  const res = await fetch("/api/versions/" + vid);
  const data = await res.json();
  $("v-errors").innerHTML = `<h3>v${vid} 错误明细</h3>
    <table><tr><th>文件</th><th>行号</th><th>字段</th><th>错误</th></tr>
    ${data.errors.map(e => `<tr><td>${e.file}</td><td>${e.row ?? "-"}</td>
      <td>${e.field ?? "-"}</td><td>${e.message}</td></tr>`).join("")}</table>`;
}

// ---------- 运行图差异分析 ----------
$("d-date").value = new Date().toISOString().slice(0, 10);
let diffVersions = [];

async function initDiffTab() {
  if (!diffVersions.length) {
    const res = await fetch("/api/versions");
    const data = await res.json();
    diffVersions = (data.versions || []).filter(v => v.status === "published");
    const opts = diffVersions.length
      ? diffVersions.map(v => `<option value="${v.id}">v${v.id} ${v.label}</option>`).join("")
      : '<option value="">（暂无已发布版本）</option>';
    $("d-old").innerHTML = opts;
    $("d-new").innerHTML = opts;
    if (diffVersions.length >= 2) {
      // 列表按 id 倒序：默认旧版选次新、新版选最新
      $("d-new").selectedIndex = 0;
      $("d-old").selectedIndex = 1;
    }
  }
  loadDiffRoutes();
}

async function loadDiffRoutes() {
  const oldId = $("d-old").value, newId = $("d-new").value;
  const sel = $("d-route");
  if (!oldId || !newId) { sel.innerHTML = "<option value=''>（请先选择两个版本）</option>"; return; }
  const [r1, r2] = await Promise.all([
    fetch(`/api/versions/${oldId}/routes`).then(r => r.ok ? r.json() : {routes: []}),
    fetch(`/api/versions/${newId}/routes`).then(r => r.ok ? r.json() : {routes: []}),
  ]);
  const merged = new Map();
  for (const r of [...r1.routes, ...r2.routes]) {
    if (!merged.has(r.route_id)) merged.set(r.route_id, r);
  }
  sel.innerHTML = [...merged.values()].map(r =>
    `<option value="${r.route_id}">${r.route_short_name || r.route_id} ${r.route_long_name || ""}</option>`).join("")
    || "<option value=''>（两版均无线路）</option>";
}
$("d-old").onchange = loadDiffRoutes;
$("d-new").onchange = loadDiffRoutes;

function fmtDelta(secs, minutes) {
  if (secs === null || minutes === null) return '<span class="muted">不适用（停站变化）</span>';
  if (secs === 0) return '<span class="delta-zero">0 分钟（不变）</span>';
  const cls = secs > 0 ? "delta-pos" : "delta-neg";
  const sign = secs > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${minutes} 分钟（${sign}${secs} 秒）</span>`;
}

function stopCell(s) {
  if (!s) return '<span class="muted">（该侧无此停站）</span>';
  const off = (s.arrival_day_offset > 0 || s.departure_day_offset > 0)
    ? ` <span class="nextday">+${Math.max(s.arrival_day_offset, s.departure_day_offset)}天</span>` : "";
  return `${s.stop_name} <span class="muted">${s.stop_id}</span> · 到 ${s.arrival} / 发 ${s.departure}${off}`;
}

function tripList(trips) {
  if (!trips.length) return '<p class="muted">无</p>';
  return '<table><tr><th>班次</th><th>方向/服务</th><th>停站序列</th><th>首站发车</th></tr>' +
    trips.map(t => `<tr>
      <td>${t.trip_id}${t.headsign ? " · " + t.headsign : ""}</td>
      <td class="tripmini">direction=${t.direction_id ?? "-"} / ${t.service_id}</td>
      <td class="tripmini">${t.stop_times.map(s => s.stop_id).join(" → ")}</td>
      <td class="tripmini">${t.stop_times[0]?.departure ?? "-"}</td>
    </tr>`).join("") + "</table>";
}

function renderTripGroup(badge, badgeText, trips, withTimes) {
  if (!trips.length) return "";
  return `<div class="diff-group"><h3><span class="badge ${badge}">${badgeText}</span> ${trips.length} 个班次</h3>` +
    (withTimes ? trips.map(t => `
      <div class="trip">
        <h4 style="margin:8px 0 4px;font-size:13px">班次 ${t.trip_id}${t.headsign ? " · " + t.headsign : ""}
          <span class="muted">service: ${t.service_id}</span></h4>
        <table><tr><th>序号</th><th>站点</th><th>到站</th><th>发车</th></tr>
        ${t.stop_times.map(s => `<tr><td>${s.stop_sequence}</td>
          <td>${s.stop_name} <span class="muted">${s.stop_id}</span></td>
          <td>${s.arrival}${s.arrival_day_offset > 0 ? ` <span class="nextday">+${s.arrival_day_offset}天</span>` : ""}</td>
          <td>${s.departure}${s.departure_day_offset > 0 ? ` <span class="nextday">+${s.departure_day_offset}天</span>` : ""}</td>
        </tr>`).join("")}</table>
      </div>`).join("")
      : tripList(trips)) + "</div>";
}

$("d-btn").onclick = async () => {
  const oldId = $("d-old").value, newId = $("d-new").value,
        route = $("d-route").value, date = $("d-date").value;
  const box = $("d-result");
  if (!oldId || !newId) { box.innerHTML = '<div class="banner err">请选择两个已发布版本</div>'; return; }
  if (oldId === newId) { box.innerHTML = '<div class="banner err">请选择两个不同的版本</div>'; return; }
  if (!route || !date) { box.innerHTML = '<div class="banner err">请选择线路和运营日</div>'; return; }

  const url = `/api/diff?old_version_id=${oldId}&new_version_id=${newId}`
    + `&route_id=${encodeURIComponent(route)}&date=${date}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) { box.innerHTML = `<div class="banner err">${typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)}</div>`; return; }

  const s = data.summary;
  let html = `<p class="muted">旧版 v${data.old_version.id}「${data.old_version.label}」
    ${data.old_version.route_present ? "" : '<span class="bad">（该版无此线路）</span>'}
    → 新版 v${data.new_version.id}「${data.new_version.label}」
    ${data.new_version.route_present ? "" : '<span class="bad">（该版无此线路）</span>'}
    · 线路 ${data.route_id} · ${data.date}（${data.weekday}）</p>
    <div class="summary-pills">
      <span>旧版班次 ${s.old_trip_count}</span><span>新版班次 ${s.new_trip_count}</span>
      <span class="badge add">新增 ${s.added}</span><span class="badge rm">移除 ${s.removed}</span>
      <span class="badge adj">调整 ${s.adjusted}</span><span class="badge same">未变 ${s.unchanged}</span>
      <span class="badge conflict">冲突 ${s.conflicts}</span>
    </div>`;

  html += renderTripGroup("add", "新增", data.added, true);
  html += renderTripGroup("rm", "移除", data.removed, true);

  if (data.adjusted.length) {
    html += `<div class="diff-group"><h3><span class="badge adj">调整</span> ${data.adjusted.length} 个班次（含首个变化停站）</h3>` +
      data.adjusted.map(a => {
        const fc = a.first_change;
        return `<div class="trip">
          <h4 style="margin:8px 0 4px;font-size:13px">
            班次 ${a.old_trip.trip_id} → ${a.new_trip.trip_id}
            <span class="muted">匹配方式：${a.matched_by === "trip_id" ? "班次号" : "有序停站序列"}</span>
            ${a.old_trip.trip_id !== a.new_trip.trip_id ? '<span class="badge conflict">班次号已变化</span>' : ""}
          </h4>
          <table>
            <tr><th></th><th>首个变化停站（第 ${fc.index + 1} 个，${fc.change_type === "stop" ? "停站变化" : "时刻变化"}）</th></tr>
            <tr><td>旧</td><td>${stopCell(fc.old_stop)}</td></tr>
            <tr><td>新</td><td>${stopCell(fc.new_stop)}</td></tr>
            <tr><td>到站变化</td><td>${fmtDelta(fc.arrival_delta_secs, fc.arrival_delta_minutes)}</td></tr>
            <tr><td>发车变化</td><td>${fmtDelta(fc.departure_delta_secs, fc.departure_delta_minutes)}</td></tr>
          </table>
          <details><summary class="muted">查看两版完整停站时刻</summary>
            <table><tr><th>版本</th><th>序号</th><th>站点</th><th>到站</th><th>发车</th></tr>
            ${a.old_trip.stop_times.map(x => `<tr><td>旧</td><td>${x.stop_sequence}</td><td>${x.stop_name} <span class="muted">${x.stop_id}</span></td><td>${x.arrival}</td><td>${x.departure}</td></tr>`).join("")}
            ${a.new_trip.stop_times.map(x => `<tr><td>新</td><td>${x.stop_sequence}</td><td>${x.stop_name} <span class="muted">${x.stop_id}</span></td><td>${x.arrival}</td><td>${x.departure}</td></tr>`).join("")}
            </table>
          </details>
        </div>`;
      }).join("") + "</div>";
  }

  if (data.unchanged.length) {
    html += `<div class="diff-group"><h3><span class="badge same">未变化</span> ${data.unchanged.length} 个班次</h3>
      <p class="muted">${data.unchanged.map(u => u.old_trip_id === u.new_trip_id
        ? u.old_trip_id : `${u.old_trip_id} → ${u.new_trip_id}`).join("、")}</p></div>`;
  }

  if (data.conflicts.length) {
    html += `<div class="diff-group"><h3><span class="badge conflict">匹配冲突</span> ${data.conflicts.length} 组（候选不唯一，未擅自合并）</h3>` +
      data.conflicts.map(c => `
        <div class="trip">
          <h4 style="margin:8px 0 4px;font-size:13px">停站序列：${c.signature.join(" → ")}</h4>
          <p class="muted">旧版候选 ${c.old_trips.length} 个 / 新版候选 ${c.new_trips.length} 个，下列班次均未计入新增、移除或调整：</p>
          <p class="muted">旧版：</p>${tripList(c.old_trips)}
          <p class="muted">新版：</p>${tripList(c.new_trips)}
        </div>`).join("") + "</div>";
  }

  box.innerHTML = html;
};

loadRoutes();
</script>
</body>
</html>
